disabled_rules:
  # Job.State / Job.Kind read better nested inside the job they describe (as in Mango).
  - nesting
  - shorthand_operator
  - type_body_length
  - large_tuple
  - redundant_discardable_let
  - trailing_comma
type_name:
  min_length: 1
line_length: 1000
identifier_name:
  min_length: 1
cyclomatic_complexity:
  warning: 20
  error: 30
function_body_length:
  warning: 100
  error: 150
excluded:
  - build
  - DerivedData
  - fixtures
  # One-shot generators run with `swift scripts/…`, not part of the app target.
  - scripts
file_length:
  warning: 700
  error: 1000
function_parameter_count:
  warning: 7
  error: 10
